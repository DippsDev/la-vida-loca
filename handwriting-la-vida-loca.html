<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Vida Loca — Handwriting</title>
  <style>
    :root {
      --ink: #3730a3;
      --ink-glow: #818cf8;
      --bg: #f8fafc;
      --cycle: 8s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 70% 50% at 50% 42%, #e0e7ff 0%, transparent 60%),
        var(--bg);
      overflow: hidden;
    }

    .stage {
      width: min(94vw, 1000px);
    }

    .signature {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .signature path {
      fill: none;
      stroke: var(--ink);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      /* pathLength="1" makes dash units normalized — reliable across browsers */
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: handwrite var(--cycle) cubic-bezier(0.4, 0, 0.2, 1) infinite;
      filter: drop-shadow(0 1px 1px rgb(55 48 163 / 12%));
    }

    .signature .w1 { animation-delay: 0s; }
    .signature .w2 { animation-delay: 0.65s; }
    .signature .w3 { animation-delay: 1.85s; }
    .signature .dot {
      animation-delay: 1.55s;
      stroke-width: 3.2;
    }
    .signature .flourish {
      animation-delay: 3.05s;
      stroke: var(--ink-glow);
      stroke-width: 2.15;
      opacity: 0.9;
    }

    @keyframes handwrite {
      0%   { stroke-dashoffset: 1; opacity: 1; }
      44%  { stroke-dashoffset: 0; opacity: 1; }
      69%  { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 1; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .signature path {
        animation: none;
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="stage" role="img" aria-label="La Vida Loca written in live cursive handwriting">

    </svg>
  </div>
</body>
</html>
